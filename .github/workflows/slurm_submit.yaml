name: Submit Slurm Job to PARAM

on:
  push:
    branches:
      - test-hello
      - intern-*
    paths:
      - '**.py'

jobs:
  run-on-param:
    runs-on: self-hosted

    steps:
      - name: Manual Git Setup
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd ${GITHUB_WORKSPACE}
          
          # Clean workspace
          rm -rf .git* || true
          rm -rf * || true
          
          # Clone the repository
          git clone https://x-access-token:$TOKEN@github.com/sarthaksam003/ReasoningLLM.git .
          
          # Switch to the correct branch
          git checkout ${{ github.ref_name }}
          
          echo "=== Repository setup complete ==="
          echo "Current branch: $(git branch --show-current)"
          echo "Files in workspace:"
          ls -la

      - name: Sync files to intern workspace
        run: |
          INTERN_REPO_PATH="/home/sarthaks/InternWork/intern_repos"
          
          echo "Syncing Python files to intern workspace..."
          mkdir -p ${INTERN_REPO_PATH}
          
          # Copy Python files
          find ${GITHUB_WORKSPACE} -name "*.py" -exec cp {} ${INTERN_REPO_PATH}/ \;
          
          echo "Files in intern workspace:"
          ls -la ${INTERN_REPO_PATH}/

      - name: Submit to SLURM
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          JOBNAME="job_${TIMESTAMP}"
          LOGDIR="/home/sarthaks/InternWork/logs"
          INTERN_REPO_PATH="/home/sarthaks/InternWork/intern_repos"

          echo "#!/bin/bash" > job.sh
          echo "#SBATCH -N 1" >> job.sh
          echo "#SBATCH --ntasks-per-node=1" >> job.sh
          echo "#SBATCH --time=00:05:00" >> job.sh
          echo "#SBATCH --job-name=${JOBNAME}" >> job.sh
          echo "#SBATCH --output=${LOGDIR}/${JOBNAME}.out" >> job.sh
          echo "#SBATCH --error=${LOGDIR}/${JOBNAME}.err" >> job.sh
          echo "#SBATCH --partition=standard" >> job.sh

          echo "cd ${INTERN_REPO_PATH}" >> job.sh
          echo "source /home/sarthaks/miniconda3/etc/profile.d/conda.sh" >> job.sh
          echo "conda activate mor_env" >> job.sh
          
          echo "export OUTPUT_FILENAME=\"output_${TIMESTAMP}.txt\"" >> job.sh
          
          echo "echo \"=== Starting Python execution ===\"" >> job.sh
          echo "if [ -f \"main.py\" ]; then" >> job.sh
          echo "  echo \"Running main.py -> \$OUTPUT_FILENAME\"" >> job.sh
          echo "  python main.py" >> job.sh
          echo "elif [ -f \"hello.py\" ]; then" >> job.sh
          echo "  echo \"Running hello.py -> \$OUTPUT_FILENAME\"" >> job.sh
          echo "  python hello.py" >> job.sh
          echo "else" >> job.sh
          echo "  echo \"Error: No main.py or hello.py found!\"" >> job.sh
          echo "  exit 1" >> job.sh
          echo "fi" >> job.sh
          echo "echo \"=== Python execution completed ===\"" >> job.sh

          JOB_ID=$(sbatch --parsable job.sh)
          
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "JOBNAME=${JOBNAME}" >> $GITHUB_ENV
          echo "LOGDIR=${LOGDIR}" >> $GITHUB_ENV
          echo "INTERN_REPO_PATH=${INTERN_REPO_PATH}" >> $GITHUB_ENV

          echo "Waiting for Slurm job ${JOB_ID} to finish..."
          while squeue -j "$JOB_ID" 2>/dev/null | grep -q "$JOB_ID"; do
            sleep 5
          done
          echo "Slurm job ${JOB_ID} completed."

      - name: Push Output File to GitHub
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd ${GITHUB_WORKSPACE}
          
          mkdir -p outputs logs
          
          # Copy output from intern_repos to GitHub workspace
          OUTPUT_FILE="output_${TIMESTAMP}.txt"
          if [ -f "${INTERN_REPO_PATH}/${OUTPUT_FILE}" ]; then
            cp "${INTERN_REPO_PATH}/${OUTPUT_FILE}" outputs/
            echo "✓ Found and copied ${OUTPUT_FILE} to outputs/"
          else
            echo "✗ ${OUTPUT_FILE} not found in ${INTERN_REPO_PATH}"
            echo "Files in intern_repos:"
            ls -la ${INTERN_REPO_PATH}/
          fi
          
          # Copy log files
          if [ -f "${LOGDIR}/${JOBNAME}.out" ]; then
            cp "${LOGDIR}/${JOBNAME}.out" logs/
            echo "✓ Found and copied ${JOBNAME}.out to logs/"
          fi
          
          if [ -f "${LOGDIR}/${JOBNAME}.err" ]; then
            cp "${LOGDIR}/${JOBNAME}.err" logs/
            echo "✓ Found and copied ${JOBNAME}.err to logs/"
          fi

          # Configure git and push
          git config user.name "PARAM Runner Bot"
          git config user.email "runner@company.com"

          git add outputs/ logs/ job.sh

          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add pipeline outputs and logs - $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin ${{ github.ref_name }}
            echo "Successfully pushed results to GitHub"
          fi