name: Submit Slurm Job to PARAM

on:
  push:
    branches:
      - test-hello
      - intern-*
    paths:
      - '**.py'

jobs:
  run-on-param:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Debug workspace
        run: |
          echo "=== DEBUG INFO ==="
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "HOME: ${HOME}"
          echo "USER: $(whoami)"
          
          echo "=== DIRECTORY CONTENTS ==="
          ls -la
          
          echo "=== GIT STATUS ==="
          git status || echo "Git command failed"
          
          echo "=== GIT CONFIG ==="
          git config --list || echo "Git config failed"
          
          echo "=== CHECKING .git directory ==="
          if [ -d ".git" ]; then
            echo "✓ .git directory exists"
            ls -la .git/
          else
            echo "✗ .git directory NOT found"
            find . -name ".git" -type d 2>/dev/null || echo "No .git found anywhere"
          fi

      - name: Sync files to intern workspace
        run: |
          INTERN_REPO_PATH="/home/sarthaks/InternWork/intern_repos"
          
          echo "Syncing Python files to intern workspace..."
          mkdir -p ${INTERN_REPO_PATH}
          
          # Copy Python files from GitHub workspace to intern_repos
          cp ${GITHUB_WORKSPACE}/*.py ${INTERN_REPO_PATH}/ 2>/dev/null || echo "No Python files to copy"
          
          echo "Files in intern workspace:"
          ls -la ${INTERN_REPO_PATH}/

      - name: Submit to SLURM
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          JOBNAME="job_${TIMESTAMP}"
          LOGDIR="/home/sarthaks/InternWork/logs"
          INTERN_REPO_PATH="/home/sarthaks/InternWork/intern_repos"

          echo "#!/bin/bash" > job.sh
          echo "#SBATCH -N 1" >> job.sh
          echo "#SBATCH --ntasks-per-node=1" >> job.sh
          echo "#SBATCH --time=00:05:00" >> job.sh
          echo "#SBATCH --job-name=${JOBNAME}" >> job.sh
          echo "#SBATCH --output=${LOGDIR}/${JOBNAME}.out" >> job.sh
          echo "#SBATCH --error=${LOGDIR}/${JOBNAME}.err" >> job.sh
          echo "#SBATCH --partition=standard" >> job.sh

          echo "cd ${INTERN_REPO_PATH}" >> job.sh
          echo "source /home/sarthaks/miniconda3/etc/profile.d/conda.sh" >> job.sh
          echo "conda activate mor_env" >> job.sh
          
          echo "export OUTPUT_FILENAME=\"output_${TIMESTAMP}.txt\"" >> job.sh
          
          echo "echo \"=== Starting Python execution ===\"" >> job.sh
          echo "if [ -f \"main.py\" ]; then" >> job.sh
          echo "  echo \"Running main.py -> \$OUTPUT_FILENAME\"" >> job.sh
          echo "  python main.py" >> job.sh
          echo "elif [ -f \"hello.py\" ]; then" >> job.sh
          echo "  echo \"Running hello.py -> \$OUTPUT_FILENAME\"" >> job.sh
          echo "  python hello.py" >> job.sh
          echo "else" >> job.sh
          echo "  echo \"Error: No main.py or hello.py found!\"" >> job.sh
          echo "  exit 1" >> job.sh
          echo "fi" >> job.sh
          echo "echo \"=== Python execution completed ===\"" >> job.sh

          JOB_ID=$(sbatch --parsable job.sh)
          
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "JOBNAME=${JOBNAME}" >> $GITHUB_ENV
          echo "LOGDIR=${LOGDIR}" >> $GITHUB_ENV
          echo "INTERN_REPO_PATH=${INTERN_REPO_PATH}" >> $GITHUB_ENV

          echo "Waiting for Slurm job ${JOB_ID} to finish..."
          while squeue -j "$JOB_ID" 2>/dev/null | grep -q "$JOB_ID"; do
            sleep 5
          done
          echo "Slurm job ${JOB_ID} completed."

      - name: Push Output File to GitHub
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "=== STARTING PUSH PROCESS ==="
          echo "Current directory: $(pwd)"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          
          # Ensure we're in the right directory
          cd ${GITHUB_WORKSPACE}
          echo "Changed to: $(pwd)"
          
          # Check git status again
          echo "=== GIT STATUS CHECK ==="
          if [ -d ".git" ]; then
            echo "✓ .git directory found"
            git status
          else
            echo "✗ .git directory still not found"
            echo "Directory contents:"
            ls -la
            echo "This suggests the checkout didn't work properly"
            exit 1
          fi
          
          # Create directories
          mkdir -p outputs logs
          
          # Copy output from intern_repos to GitHub workspace
          OUTPUT_FILE="output_${TIMESTAMP}.txt"
          if [ -f "${INTERN_REPO_PATH}/${OUTPUT_FILE}" ]; then
            cp "${INTERN_REPO_PATH}/${OUTPUT_FILE}" outputs/
            echo "✓ Copied ${OUTPUT_FILE} to outputs/"
          else
            echo "✗ ${OUTPUT_FILE} not found in ${INTERN_REPO_PATH}"
            echo "Files in intern_repos:"
            ls -la ${INTERN_REPO_PATH}/
          fi
          
          # Copy log files
          if [ -f "${LOGDIR}/${JOBNAME}.out" ]; then
            cp "${LOGDIR}/${JOBNAME}.out" logs/
            echo "✓ Copied ${JOBNAME}.out to logs/"
          fi
          
          if [ -f "${LOGDIR}/${JOBNAME}.err" ]; then
            cp "${LOGDIR}/${JOBNAME}.err" logs/
            echo "✓ Copied ${JOBNAME}.err to logs/"
          fi
          
          echo "=== FILES COLLECTED ==="
          echo "Outputs:"
          ls -la outputs/ || echo "No outputs directory"
          echo "Logs:"
          ls -la logs/ || echo "No logs directory"

          # Git operations with better error handling
          echo "=== GIT OPERATIONS ==="
          
          # Configure git
          git config --global user.name "PARAM Runner Bot"
          git config --global user.email "runner@company.com"
          
          # Add safe directory
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          
          # Add files
          git add outputs/ logs/ job.sh
          
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            echo "Committing changes..."
            git commit -m "Add pipeline outputs and logs - $(date '+%Y-%m-%d %H:%M:%S')"
            
            echo "Getting current branch..."
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "Current branch: $CURRENT_BRANCH"
            
            echo "Setting remote URL..."
            git remote set-url origin "https://x-access-token:$TOKEN@github.com/sarthaksam003/ReasoningLLM.git"
            
            echo "Pushing to GitHub..."
            git push origin HEAD:$CURRENT_BRANCH
            
            echo "✓ Successfully pushed to GitHub"
          fi